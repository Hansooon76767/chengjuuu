<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/768px-Google_%22G%22_logo.svg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>成局 - 同城项目组局</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--text-primary)',
              secondary: 'var(--text-secondary)',
              surface: 'var(--bg-surface)', 
              accent: '#FACC15', 
              'accent-soft': '#FEF9C3',
            },
            boxShadow: {
              'premium': '0 4px 20px -2px rgba(0, 0, 0, 0.05)', 
              'premium-lg': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
              'inset-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)',
              'float': '0 4px 12px -2px rgba(0, 0, 0, 0.08)',
              'accent-glow': '0 4px 12px -2px rgba(250, 204, 21, 0.3)',
            },
            borderRadius: {
              '4xl': '24px',
              '5xl': '32px',
            },
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-surface: #FFFFFF;
        --text-primary: #000000;
        --text-secondary: #666666;
      }
      .dark {
        --bg-surface: #000000;
        --text-primary: #FFFFFF;
        --text-secondary: #A1A1AA;
      }

      body {
        background-color: var(--bg-surface);
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      ::-webkit-scrollbar { display: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .tap-feedback:active {
        opacity: 0.7;
        transition: opacity 0.1s ease;
      }
      
      .nav-transition {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-surface text-primary antialiased">
    <div id="root"></div>
  </body>
</html>
